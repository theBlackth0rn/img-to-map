<div class="container">
  <div class="row">
    <div class="col-md-8" style="margin: auto">
      <image-uploader (imageLoadingSuccessful)="onSuccessfulUpload($event)"> </image-uploader>
      <div [hidden]="!displayEditors">
        <editor1 (displayImageChanged)="propagateImageChangeFrom(0)"> </editor1>
        <editor2
          (displayImageChanged)="propagateImageChangeFrom(1)"
          (editorExpanded)="onEditorExpanded(1)"
        >
        </editor2>
        <editor2-new
          (displayImageChanged)="propagateImageChangeFrom(1)"
          (editorExpanded)="onEditorExpanded(1)"
        >
        </editor2-new>
        <editor3
          (displayImageChanged)="propagateImageChangeFrom(2)"
          (editorExpanded)="onEditorExpanded(2)"
        >
        </editor3>
        <image-downloader (editorExpanded)="onEditorExpanded(3)"> </image-downloader>
      </div>
    </div>
  </div>
</div>
